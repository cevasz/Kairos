name: kairos
description: "Tu rutina del día a día: a qué hora salir, pendientes y rachas."
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado. Providers escritos a mano: no se usa el generador de Riverpod.
  flutter_riverpod: ^2.5.1

  # Base de datos local (offline-first)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  # Validar una copia de seguridad antes de restaurarla (§51).
  sqlite3: ^3.5.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Formato de fechas en es_CO
  intl: ^0.20.3
  # Importar calendario .ics: el selector de archivos es el del sistema.
  file_picker: ^12.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.34.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
